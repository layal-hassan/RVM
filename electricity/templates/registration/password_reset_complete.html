{% load static i18n %}
<!DOCTYPE html>
{% get_current_language as CURRENT_LANGUAGE %}
<html lang="{{ CURRENT_LANGUAGE }}" dir="{% if CURRENT_LANGUAGE == 'ar' %}rtl{% else %}ltr{% endif %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% trans "Password Updated" %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Vesper+Libre:wght@400;600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'electricity/css/select-system.css' %}">
  <link rel="stylesheet" href="{% static 'electricity/css/admin_login.css' %}">
  <link rel="stylesheet" href="{% static 'electricity/css/typography.css' %}">
</head>
<body class="admin-login-body admin-login-body-dark">
  <div class="admin-login-shell">
    <div class="admin-login-card admin-login-card-dark">
      <h1>{% trans "Password updated" %}</h1>
      <p class="admin-login-subtitle">{% trans "Your password has been changed successfully. You can sign in now." %}</p>
      <div class="admin-login-note">
        <a href="{% url 'electricity:login' %}">{% trans "Go to sign in" %}</a>
      </div>
    </div>
  </div>
</body>
</html>
