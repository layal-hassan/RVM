{% extends "electricity/electrician_booking/base.html" %}
{% load i18n %}
{% block booking_content %}
<form method="post" class="eb-form">{% csrf_token %}
  <section class="eb-card">
    <div class="eb-card-header"><span class="eb-step-badge">1</span><div>
      <h1>{% trans "Who is this booking for?" %}</h1>
      <p>{% trans "Choose your customer type so we can show the right booking path." %}</p>
    </div></div>
    <div class="eb-customer-grid">
      <label class="eb-customer-card">
        <input type="radio" name="customer_type" value="private" {% if data.customer_type == "private" %}checked{% endif %}>
        <div class="eb-customer-icon">P</div><div><div class="eb-service-title">{% trans "Private customer" %}</div>
        <div class="eb-service-sub">{% trans "Electrical work for your home or private property." %}</div></div>
      </label>
      <label class="eb-customer-card">
        <input type="radio" name="customer_type" value="business" {% if data.customer_type == "business" %}checked{% endif %}>
        <div class="eb-customer-icon">B</div><div><div class="eb-service-title">{% trans "Business" %}</div>
        <div class="eb-service-sub">{% trans "Electrical work for a company or organization." %}</div></div>
      </label>
    </div>
  </section>
  <div class="eb-actions"><a class="btn btn-light" href="{% url 'electricity:home' %}">{% trans "Back" %}</a>
  <button class="btn btn-primary" type="submit">{% trans "Continue to service" %}</button></div>
</form>
{% endblock %}
