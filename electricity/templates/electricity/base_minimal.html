{% load static i18n %}
<!DOCTYPE html>
{% get_current_language as CURRENT_LANGUAGE %}
<html lang="{{ CURRENT_LANGUAGE }}" dir="{% if CURRENT_LANGUAGE == 'ar' %}rtl{% else %}ltr{% endif %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% trans "Electrical & Smart Home" %}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Vesper+Libre:wght@400;500;600;700&display=swap" rel="stylesheet">
  {% if CURRENT_LANGUAGE == "ar" %}
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  {% endif %}
  <link rel="stylesheet" href="{% static 'electricity/css/select-system.css' %}?v=20261019-2">
  <link rel="stylesheet" href="{% static 'electricity/css/electricity.css' %}?v=20261018-2">
  <link rel="stylesheet" href="{% static 'electricity/css/global_header.css' %}?v=20261027-3">
  <link rel="stylesheet" href="{% static 'electricity/css/responsive.css' %}?v=20261020-2">
  <link rel="stylesheet" href="{% static 'electricity/css/typography.css' %}">
  <link rel="preconnect" href="https://static.linguise.com" crossorigin>
  <link rel="dns-prefetch" href="//static.linguise.com">
  <link rel="preload" as="script" crossorigin href="https://static.linguise.com/script-js/switcher.bundle.js?d=pk_Eq83nw6rdzq0vzy6p0xSaHp6oZtdHkGX">
  <script defer src="https://static.linguise.com/script-js/switcher.bundle.js?d=pk_Eq83nw6rdzq0vzy6p0xSaHp6oZtdHkGX"></script>
</head>
<body class="electricity-body electricity-minimal">

  {% include "electricity/partials/global_header.html" %}
  {% block content %}{% endblock %}

  <script defer src="{% static 'electricity/vendor/tom-select/tom-select.complete.min.js' %}"></script>
  <script defer src="{% static 'electricity/js/global.js' %}"></script>
  <script defer src="{% static 'electricity/js/global_header.js' %}?v=20261027-1"></script>
</body>
</html>
